[project]
name = "CaCarbot-models"
version = "0.1.0"
description = "AI model downloader and builder for CaCarbot on Synaptics Coralboard SL"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Shane Loretz", email = "shane.loretz@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "requests>=2.34.2",
    "tqdm>=4.70.1",
]

[project.optional-dependencies]
compile = [
    "torq-compiler>=2.2.0; python_version >= '3.12'",
]

[project.scripts]
cacarbot-models = "cacarbot_models:main"
CaCarbot-models = "cacarbot_models:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

