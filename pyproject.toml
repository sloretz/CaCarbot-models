[project]
name = "CaCarbot-models"
version = "0.3.0"
description = "AI model downloader and builder for CaCarbot on Synaptics Coralboard SL"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Shane Loretz", email = "shane.loretz@gmail.com" }
]
requires-python = ">=3.12, <3.13"
dependencies = [
    "requests>=2.31.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
compile = [
    "torq-compiler>=2.2.0",
    "tosa-converter-for-tflite>=2026.2.0",
    "onnx2tf[tensorflow]>=2.6.8",
    "tf-keras>=2.18.0",
    "tensorflow-cpu>=2.18.0",
    "onnx>=1.16.0",
    "numpy>=1.26.0",
    "pillow>=10.0.0",
]

[project.scripts]
cacarbot-models = "cacarbot_models:main"
CaCarbot-models = "cacarbot_models:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

